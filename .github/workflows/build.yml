name: Build Latest Experimental Turnip Drivers

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  BUILD_VERSION: ${{ github.run_number }}

jobs:
  build:
    name: Build & Release Turnip Drivers
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # Free runner disk space
      #
      # GitHub-hosted runners have limited SSD space. Turnip/Mesa
      # builds can use several GB during NDK download + compilation.
      # These directories contain tools that are not required by the
      # Turnip build and are safe to remove on a disposable runner.
      # ============================================================
      - name: Prepare Build Storage
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo " Disk space BEFORE cleanup"
          echo "=========================================="
          df -h /
          echo

          echo "Removing unnecessary preinstalled toolchains..."

          # Large preinstalled toolchains not required by Turnip.
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          # Preinstalled Android SDK/NDK is not used by build_turnip.sh;
          # the required Android NDK r29 is downloaded explicitly by it.
          sudo rm -rf /usr/local/lib/android || true

          # Remove Docker images/cache if present.
          if command -v docker >/dev/null 2>&1; then
            sudo docker system prune -af --volumes || true
          fi

          # Remove package-manager caches.
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true

          # Remove runner/user caches that are not needed for this build.
          rm -rf "${HOME}/.cache" || true

          sync

          echo
          echo "=========================================="
          echo " Disk space AFTER cleanup"
          echo "=========================================="
          df -h /

          echo
          echo "Filesystem:"
          df -B1 / | tail -n 1

          AVAILABLE_KB=$(df --output=avail / | tail -n 1 | tr -d ' ')

          # Require at least 7 GB free before starting the build.
          REQUIRED_KB=$((7 * 1024 * 1024))

          if (( AVAILABLE_KB < REQUIRED_KB )); then
            echo "::error::Not enough free disk space."
            echo "Available: ${AVAILABLE_KB} KB"
            echo "Required:  ${REQUIRED_KB} KB"
            exit 1
          fi

          echo
          echo "Enough disk space is available for the Turnip build."

      # ============================================================
      # Dependencies
      # ============================================================
      - name: Install Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo " Checking build tools"
          echo "=========================================="

          command -v git
          command -v python3
          command -v pip3
          command -v ninja
          command -v flex
          command -v bison
          command -v patchelf
          command -v unzip
          command -v zip
          command -v curl

          echo
          echo "Git:      $(git --version)"
          echo "Python:   $(python3 --version)"
          echo "Pip:      $(python3 -m pip --version)"
          echo "Ninja:    $(ninja --version)"
          echo "Patchelf: $(patchelf --version | head -n 1)"

          # Only install glslang when it is genuinely missing.
          if ! command -v glslangValidator >/dev/null 2>&1; then
            echo
            echo "glslangValidator is missing."
            echo "Installing glslang-tools..."

            if ! sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              install -y --no-install-recommends glslang-tools; then

              echo "Refreshing package lists..."

              sudo apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=20 \
                -o Acquire::https::Timeout=20 \
                update

              sudo apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=20 \
                -o Acquire::https::Timeout=20 \
                install -y --no-install-recommends glslang-tools
            fi
          fi

          echo
          echo "=========================================="
          echo " Installing Python dependencies"
          echo "=========================================="

          python3 -m pip install \
            --break-system-packages \
            --disable-pip-version-check \
            --no-cache-dir \
            meson \
            mako

          echo
          echo "=========================================="
          echo " Verifying dependencies"
          echo "=========================================="

          echo "Meson:"
          meson --version

          echo
          echo "Mako:"
          python3 -c "import mako; print(mako.__version__)"

          echo
          echo "GLSLang:"
          glslangValidator --version | head -n 2

          echo
          echo "=========================================="
          echo " Disk space before build"
          echo "=========================================="

          df -h /

      # ============================================================
      # Build
      # ============================================================
      - name: Build Turnip Drivers
        shell: bash
        env:
          BUILD_VERSION: ${{ github.run_number }}
        run: |
          set -Eeuo pipefail

          chmod +x build_turnip.sh

          echo "=========================================="
          echo " Building Turnip Drivers"
          echo "=========================================="
          echo "Version: v${BUILD_VERSION}"
          echo "Commit:  ${GITHUB_SHA}"
          echo "Ref:     ${GITHUB_REF_NAME}"
          echo

          df -h /

          ./build_turnip.sh

      # ============================================================
      # Validate build
      # ============================================================
      - name: Validate Build Outputs
        shell: bash
        run: |
          set -Eeuo pipefail

          test -d turnip_workdir

          mapfile -t archives < <(
            find turnip_workdir \
              -maxdepth 1 \
              -type f \
              -name '*.zip' \
              -print |
            sort
          )

          if (( ${#archives[@]} == 0 )); then
            echo "::error::No Turnip driver ZIP files were produced."
            exit 1
          fi

          echo "=========================================="
          echo " Build Output"
          echo "=========================================="

          printf ' - %s\n' "${archives[@]}"

          echo
          echo "=========================================="
          echo " Validating ZIP files"
          echo "=========================================="

          for archive in "${archives[@]}"; do
            echo "Testing: ${archive}"
            unzip -t "${archive}" >/dev/null
            echo "OK"
          done

          echo
          echo "=========================================="
          echo " SHA-256"
          echo "=========================================="

          sha256sum "${archives[@]}" \
            > turnip_workdir/SHA256SUMS.txt

          cat turnip_workdir/SHA256SUMS.txt

          echo
          echo "=========================================="
          echo " Build Information"
          echo "=========================================="

          {
            echo "Turnip Drivers Build"
            echo "===================="
            echo
            echo "Version:        v${BUILD_VERSION}"
            echo "Git SHA:        ${GITHUB_SHA}"
            echo "Git Ref:        ${GITHUB_REF_NAME}"
            echo "Workflow Run:   ${GITHUB_RUN_ID}"
            echo "Run Number:     ${GITHUB_RUN_NUMBER}"
            echo "Runner:         ubuntu-24.04"
            echo "Build Date UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Artifacts:"
            printf ' - %s\n' "${archives[@]}"
            echo
            echo "SHA-256:"
            cat turnip_workdir/SHA256SUMS.txt
          } > turnip_workdir/BUILD_INFO.txt

      # ============================================================
      # Upload artifacts
      # ============================================================
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Drivers
          path: |
            turnip_workdir/*.zip
            turnip_workdir/SHA256SUMS.txt
            turnip_workdir/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ============================================================
      # GitHub Release
      # ============================================================
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Turnip Drivers v${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            turnip_workdir/*.zip
            turnip_workdir/SHA256SUMS.txt
            turnip_workdir/BUILD_INFO.txt

      # ============================================================
      # Summary
      # ============================================================
      - name: Generate Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Turnip Drivers — Build Summary"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Version | \`v${GITHUB_RUN_NUMBER}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Runner | \`ubuntu-24.04\` |"
            echo "| Artifact | \`Turnip-Drivers\` |"
            echo "| Status | \`${{ job.status }}\` |"
            echo
            echo "### Release"
            echo
            echo "[View GitHub Release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${GITHUB_RUN_NUMBER})"
          } >> "${GITHUB_STEP_SUMMARY}"

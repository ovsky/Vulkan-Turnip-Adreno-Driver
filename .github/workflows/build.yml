name: Build Latet Turnip Drivers

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  BUILD_VERSION: ${{ github.run_number }}

jobs:
  build:
    name: Build & Release Turnip Drivers
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # ─────────────────────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────────────────────
      # Dependencies
      # ─────────────────────────────────────────────────────────────
      - name: Install Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo " Checking preinstalled build tools"
          echo "=========================================="

          command -v git
          command -v python3
          command -v pip3
          command -v ninja
          command -v flex
          command -v bison
          command -v patchelf
          command -v unzip
          command -v zip
          command -v curl

          echo
          echo "Git:      $(git --version)"
          echo "Python:   $(python3 --version)"
          echo "Pip:      $(python3 -m pip --version)"
          echo "Ninja:    $(ninja --version)"
          echo "Patchelf: $(patchelf --version | head -n 1)"

          # GitHub's Ubuntu 24.04 runner already contains most
          # dependencies required by the Turnip build.
          # Only install glslang-tools when glslangValidator is missing.
          if ! command -v glslangValidator >/dev/null 2>&1; then
            echo
            echo "=========================================="
            echo " glslangValidator is missing"
            echo " Installing glslang-tools"
            echo "=========================================="

            # First try without refreshing APT indexes.
            if ! sudo apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              install -y --no-install-recommends glslang-tools; then

              echo
              echo "Existing APT indexes could not install glslang-tools."
              echo "Refreshing package indexes with network timeouts..."

              APT_SOURCES="/etc/apt/sources.list.d/ubuntu.sources"

              if [[ -f "${APT_SOURCES}" ]]; then
                sudo cp "${APT_SOURCES}" "${APT_SOURCES}.backup"

                # Avoid hanging on the Azure mirror if it is unavailable.
                sudo sed -i \
                  's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' \
                  "${APT_SOURCES}"
              fi

              sudo apt-get clean

              sudo apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=20 \
                -o Acquire::https::Timeout=20 \
                update

              sudo apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=20 \
                -o Acquire::https::Timeout=20 \
                install -y --no-install-recommends glslang-tools
            fi
          fi

          echo
          echo "=========================================="
          echo " Installing Python dependencies"
          echo "=========================================="

          python3 -m pip install \
            --break-system-packages \
            --disable-pip-version-check \
            --no-cache-dir \
            meson \
            mako

          echo
          echo "=========================================="
          echo " Verifying dependencies"
          echo "=========================================="

          echo "Meson:"
          meson --version

          echo
          echo "Mako:"
          python3 -c "import mako; print(mako.__version__)"

          echo
          echo "GLSLang:"
          glslangValidator --version | head -n 2

          echo
          echo "All dependencies are ready."

      # ─────────────────────────────────────────────────────────────
      # Build
      # ─────────────────────────────────────────────────────────────
      - name: Build Turnip Drivers
        shell: bash
        env:
          BUILD_VERSION: ${{ github.run_number }}
        run: |
          set -Eeuo pipefail

          chmod +x build_turnip.sh

          echo "=========================================="
          echo " Building Turnip Drivers"
          echo "=========================================="
          echo "Version: v${BUILD_VERSION}"
          echo "Commit:  ${GITHUB_SHA}"
          echo "Ref:     ${GITHUB_REF_NAME}"
          echo

          ./build_turnip.sh

      # ─────────────────────────────────────────────────────────────
      # Validate output
      # ─────────────────────────────────────────────────────────────
      - name: Validate Build Outputs
        shell: bash
        run: |
          set -Eeuo pipefail

          test -d turnip_workdir

          mapfile -t archives < <(
            find turnip_workdir \
              -maxdepth 1 \
              -type f \
              -name '*.zip' \
              -print |
            sort
          )

          if (( ${#archives[@]} == 0 )); then
            echo "::error::No Turnip driver ZIP files were produced."
            exit 1
          fi

          echo "=========================================="
          echo " Build Output"
          echo "=========================================="

          echo "Found ${#archives[@]} archive(s):"
          printf ' - %s\n' "${archives[@]}"

          echo
          echo "=========================================="
          echo " ZIP Validation"
          echo "=========================================="

          for archive in "${archives[@]}"; do
            echo "Validating: ${archive}"
            unzip -t "${archive}" >/dev/null
            echo "OK: ${archive}"
          done

          echo
          echo "=========================================="
          echo " SHA-256"
          echo "=========================================="

          sha256sum "${archives[@]}" > turnip_workdir/SHA256SUMS.txt
          cat turnip_workdir/SHA256SUMS.txt

          echo
          echo "=========================================="
          echo " Build Metadata"
          echo "=========================================="

          {
            echo "Turnip Drivers Build"
            echo "===================="
            echo
            echo "Version:        v${BUILD_VERSION}"
            echo "Git SHA:        ${GITHUB_SHA}"
            echo "Git Ref:        ${GITHUB_REF_NAME}"
            echo "Workflow Run:   ${GITHUB_RUN_ID}"
            echo "Run Number:     ${GITHUB_RUN_NUMBER}"
            echo "Runner:         ubuntu-24.04"
            echo "Build Date UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Artifacts:"
            printf ' - %s\n' "${archives[@]}"
            echo
            echo "SHA-256:"
            cat turnip_workdir/SHA256SUMS.txt
          } > turnip_workdir/BUILD_INFO.txt

      # ─────────────────────────────────────────────────────────────
      # Upload CI artifacts
      # ─────────────────────────────────────────────────────────────
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Turnip-Drivers
          path: |
            turnip_workdir/*.zip
            turnip_workdir/SHA256SUMS.txt
            turnip_workdir/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ─────────────────────────────────────────────────────────────
      # Release
      # ─────────────────────────────────────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}
          name: Turnip Drivers v${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            turnip_workdir/*.zip
            turnip_workdir/SHA256SUMS.txt
            turnip_workdir/BUILD_INFO.txt

      # ─────────────────────────────────────────────────────────────
      # GitHub Actions Summary
      # ─────────────────────────────────────────────────────────────
      - name: Generate Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Turnip Drivers — Build Summary"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Version | \`v${GITHUB_RUN_NUMBER}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Runner | \`ubuntu-24.04\` |"
            echo "| Artifact | \`Turnip-Drivers\` |"
            echo "| Status | \`${{ job.status }}\` |"
            echo
            echo "### Release"
            echo
            echo "[View GitHub Release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${GITHUB_RUN_NUMBER})"
          } >> "${GITHUB_STEP_SUMMARY}"
